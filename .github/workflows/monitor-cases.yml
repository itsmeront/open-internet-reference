name: Monitor open cases

on:
  schedule:
    # Mondays at 10:00 UTC, after the stale-issue pass.
    - cron: "0 10 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: python -m pip install -e '.[docs]'

      - name: Build the case-monitor report
        run: python tools/monitor_cases.py --output "$RUNNER_TEMP/case-monitor.md"

      - name: Publish the report in the job summary
        run: cat "$RUNNER_TEMP/case-monitor.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Ensure the case-monitor label exists
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh label list --limit 200 --json name --jq '.[] | select(.name=="case-monitor") | .name' | grep -qx 'case-monitor'; then
            exit 0
          fi
          gh label create case-monitor --color 1B7F4E --description "Weekly docket check for open cases"

      - name: Update the standing monitor issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          labels=(research-debt)
          if gh label list --limit 200 --json name --jq '.[] | select(.name=="case-monitor") | .name' | grep -qx 'case-monitor'; then
            labels+=(case-monitor)
          fi

          number="$(gh issue list --state open --limit 20 --search "chore: monitor open cases in:title" --json number,title --jq '.[] | select(.title=="chore: monitor open cases") | .number' | head -n 1)"

          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file "$RUNNER_TEMP/case-monitor.md"
            echo "Updated issue #$number"
            exit 0
          fi

          label_args=()
          for label in "${labels[@]}"; do
            label_args+=(--label "$label")
          done

          gh issue create \
            --title "chore: monitor open cases" \
            "${label_args[@]}" \
            --body-file "$RUNNER_TEMP/case-monitor.md"
