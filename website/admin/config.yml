backend:
  name: github
  repo: itsmeront/open-internet-reference
  branch: main
  open_authoring: true       # Allow contributions from non-collaborators via fork
  base_url: https://openinternetresearch.com
  auth_endpoint: /api/auth   # OAuth proxy endpoint (see .github/DECAP_CMS_OAUTH.md)

publish_mode: editorial_workflow  # Changes go through draft → review → publish (PR-based)

media_folder: "website/assets/images"
public_folder: "/assets/images"

# Content collections
# Note: ID fields are hidden. A temporary *-PENDING-* ID is assigned on save
# (see cms-intake.js); research editors / AI rename to a canonical ID during processing.
# Relationships are omitted from the intake form and injected empty on save.
collections:
  # Knowledge: Organizations
  - name: "organizations"
    label: "Organizations"
    label_singular: "Organization"
    folder: "knowledge/organizations"
    create: true
    slug: "pending-{{year}}{{month}}{{day}}-{{hour}}{{minute}}{{second}}-{{slug}}"
    identifier_field: "title"
    extension: "md"
    format: "yaml-frontmatter"
    editor:
      preview: false
    fields:
      - { label: "Title", name: "title", widget: "string", hint: "Organization name (required)" }
      - { label: "Summary", name: "summary", widget: "text", hint: "1–3 sentences. Paste source URLs here if helpful." }
      - { label: "Body", name: "body", widget: "markdown", required: false, hint: "Optional notes, quotes, or links. You can leave this short." }
      - { label: "ID", name: "id", widget: "hidden", default: "ORG-PENDING" }
      - { label: "Type", name: "type", widget: "hidden", default: "organization" }
      - { label: "Status", name: "status", widget: "hidden", default: "draft" }
      - { label: "Tags", name: "tags", widget: "list", default: ["organization"], required: false }
      - { label: "Sources", name: "sources", widget: "list", default: [], required: false, hint: "Optional. Editors can add SRC-* IDs later." }
      - { label: "Last Verified", name: "last_verified", widget: "hidden", default: "" }

  # Knowledge: People/Attorneys
  - name: "people"
    label: "Lawyers & People"
    label_singular: "Person"
    folder: "knowledge/people"
    create: true
    slug: "pending-{{year}}{{month}}{{day}}-{{hour}}{{minute}}{{second}}-{{slug}}"
    identifier_field: "title"
    extension: "md"
    format: "yaml-frontmatter"
    editor:
      preview: false
    fields:
      - { label: "Title", name: "title", widget: "string", hint: "Person's name (required)" }
      - { label: "Type", name: "type", widget: "select", options: ["person", "attorney", "judge"], default: "attorney" }
      - { label: "Summary", name: "summary", widget: "text", hint: "1–3 sentences. Paste source URLs here if helpful." }
      - { label: "Body", name: "body", widget: "markdown", required: false }
      - { label: "ID", name: "id", widget: "hidden", default: "PERSON-PENDING" }
      - { label: "Status", name: "status", widget: "hidden", default: "draft" }
      - { label: "Tags", name: "tags", widget: "list", default: ["attorney"], required: false }
      - { label: "Sources", name: "sources", widget: "list", default: [], required: false }
      - { label: "Last Verified", name: "last_verified", widget: "hidden", default: "" }

  # Knowledge: Legal (cases, statutes, topics)
  - name: "legal"
    label: "Law"
    label_singular: "Legal Record"
    folder: "knowledge/legal"
    create: true
    slug: "pending-{{year}}{{month}}{{day}}-{{hour}}{{minute}}{{second}}-{{slug}}"
    identifier_field: "title"
    extension: "md"
    format: "yaml-frontmatter"
    editor:
      preview: false
    fields:
      - { label: "Title", name: "title", widget: "string", hint: "Case, statute, or topic name" }
      - { label: "Type", name: "type", widget: "select", options: ["case", "statute", "regulation", "topic"], default: "case" }
      - { label: "Summary", name: "summary", widget: "text", hint: "1–3 sentences. Paste source URLs here if helpful." }
      - { label: "Body", name: "body", widget: "markdown", required: false }
      - { label: "ID", name: "id", widget: "hidden", default: "CASE-PENDING" }
      - { label: "Status", name: "status", widget: "hidden", default: "draft" }
      - { label: "Tags", name: "tags", widget: "list", default: [], required: false }
      - { label: "Sources", name: "sources", widget: "list", default: [], required: false }
      - { label: "Last Verified", name: "last_verified", widget: "hidden", default: "" }

  # Bibliography: Source Records
  - name: "sources"
    label: "Sources"
    label_singular: "Source Record"
    folder: "bibliography"
    create: true
    nested: { depth: 3 }
    slug: "pending-{{year}}{{month}}{{day}}-{{hour}}{{minute}}{{second}}-{{slug}}"
    identifier_field: "title"
    extension: "md"
    format: "yaml-frontmatter"
    editor:
      preview: false
    fields:
      - { label: "Title", name: "title", widget: "string", hint: "Short source title" }
      - { label: "Summary", name: "summary", widget: "text", hint: "What this source is. Include the URL in the body if needed." }
      - { label: "Body", name: "body", widget: "markdown", required: false, hint: "Paste the URL and any notes here." }
      - { label: "ID", name: "id", widget: "hidden", default: "SRC-PENDING" }
      - { label: "Type", name: "type", widget: "hidden", default: "source" }
      - { label: "Status", name: "status", widget: "hidden", default: "draft" }
      - { label: "Tags", name: "tags", widget: "list", default: ["source"], required: false }
      - { label: "Sources", name: "sources", widget: "list", default: [], required: false }
      - { label: "Last Verified", name: "last_verified", widget: "hidden", default: "" }

  # Contacts
  - name: "contacts"
    label: "Contacts"
    label_singular: "Contact Record"
    folder: "contacts"
    create: true
    slug: "pending-{{year}}{{month}}{{day}}-{{hour}}{{minute}}{{second}}-{{slug}}"
    identifier_field: "title"
    extension: "md"
    format: "yaml-frontmatter"
    editor:
      preview: false
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Summary", name: "summary", widget: "text" }
      - { label: "Body", name: "body", widget: "markdown", required: false }
      - { label: "ID", name: "id", widget: "hidden", default: "CONTACT-PENDING" }
      - { label: "Type", name: "type", widget: "hidden", default: "organization" }
      - { label: "Status", name: "status", widget: "hidden", default: "draft" }
      - { label: "Tags", name: "tags", widget: "list", default: ["organization", "outreach"], required: false }
      - { label: "Sources", name: "sources", widget: "list", default: [], required: false }
      - { label: "Last Verified", name: "last_verified", widget: "hidden", default: "" }
